<!DOCTYPE html>

<head>

  <title>Pride Engine — Stage 1</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: #fff;

      flex-direction: column;
      align-items: center;
    }
    #pride-canvas {

      padding: 4px 8px;
      border-radius: 4px;
    }
    .toolbar {
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="fps">FPS: --</div>
  <canvas id="pride-canvas" width="800" height="600"></canvas>

</html>
